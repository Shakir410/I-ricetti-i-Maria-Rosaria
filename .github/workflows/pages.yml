name: Deploy PWA to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Prepare static app
        run: |
          mkdir -p _site/assets/icons _site/assets/fonts
          cp index.html app.js style.css manifest.webmanifest service-worker.js _site/
          cp assets/icons/app-icon.svg assets/icons/icon-192.png assets/icons/icon-512.png assets/icons/apple-touch-icon.png _site/assets/icons/
          cp assets/fonts/Butchery.ttf assets/fonts/GFS_Galatea.ttf assets/fonts/GFS_Galatea_Bold.ttf assets/fonts/OFL.txt "assets/fonts/Readme!.txt" _site/assets/fonts/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
